# Untrusted development CI for the Yanakiev432 PdfCraft QES fork.
# Intentionally no signing keys, token PINs, package deployment, release or write permission.
name: QES fork Windows CI

on:
  push:
    branches:
      - feature/universal-signature-providers
    paths:
      - ".github/workflows/qes-fork-windows.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/**"
      - "crates/**"
      - "tools/**"
      - "packaging/windows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qes-fork-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 / test and unsigned build
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      RUST_BACKTRACE: "1"
      PDFCRAFT_REQUIRE_WINRES: "1"
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust (runner-local only)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Restore immutable Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: qes-fork-windows-x64
      - name: Test signature engine
        run: cargo test --locked -p pdfcraft-sign -- --test-threads=4
      - name: Build CI-only Windows GUI and CLI (no publisher signing)
        # The upstream release uses thin LTO / codegen-units=1. That remains
        # mandatory for any future canonical signed release, not this smoke job.
        # Keep optimized release mode (GUI subsystem), but limit CI link times.
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
        run: cargo build --locked --release -p pdfcraft -p pdfcraft-cli
      - name: Verify PE machine, GUI subsystem, checksums and unsigned release boundary
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            @{ Name='pdfcraft.exe'; ExpectedSubsystem=2 },
            @{ Name='pdfcraft-cli.exe'; ExpectedSubsystem=3 }
          )
          $lines = @(
            '## QES fork: Windows build evidence',
            "Commit: $env:GITHUB_SHA",
            'Signed and qualified: **NO — unsigned CI-only release-mode build (LTO disabled; no signer)**'
          )
          foreach ($item in $files) {
            $p = Join-Path (Get-Location) ('target/release/' + $item.Name)
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "Missing release executable: $p" }
            $bytes = [IO.File]::ReadAllBytes($p)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5c)
            if ($machine -ne 0x8664 -or $subsystem -ne $item.ExpectedSubsystem) {
              throw "PE header mismatch in $($item.Name): machine=$machine subsystem=$subsystem"
            }
            $digest = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash
            $sig = (Get-AuthenticodeSignature -LiteralPath $p).Status.ToString()
            if ($sig -ne 'NotSigned') { throw "Unexpected signed binary: $($item.Name) status=$sig; investigate provenance" }
            Write-Output "BUILD_EVIDENCE file=$($item.Name) sha256=$digest subsystem=$subsystem Authenticode=$sig"
            $lines += "$($item.Name): SHA-256 $digest; subsystem=$subsystem; $sig"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($lines -join [Environment]::NewLine)
      - name: Run CLI smoke
        run: |
          & ./target/release/pdfcraft-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke failed: $LASTEXITCODE" }

  eidas:
    name: Independent-evidence Python regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install distribution cryptography for offline unit tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-cryptography
      - name: Test all local eIDAS parsers (no personal PDF, no network calls)
        run: |
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -m unittest discover -s tools -p 'test_eidas_*.py' -q
