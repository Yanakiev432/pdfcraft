name: RFC3161 provider and bridge (offline)
on:
  pull_request:
    paths:
      - 'tools/rfc3161_provider_probe.ps1'
      - 'tools/test_rfc3161_provider_probe.ps1'
      - 'crates/sign/examples/rfc3161_external_pades_bt.rs'
      - '.github/workflows/rfc3161-provider-policy.yml'
  push:
    branches:
      - feature/rfc3161-free-provider-probe-20261019
    paths:
      - 'tools/rfc3161_provider_probe.ps1'
      - 'tools/test_rfc3161_provider_probe.ps1'
      - 'crates/sign/examples/rfc3161_external_pades_bt.rs'
      - '.github/workflows/rfc3161-provider-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate provider usage guards (never accesses TSA network)
        shell: pwsh
        run: ./tools/test_rfc3161_provider_probe.ps1
  rust-bridge-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Verify Rust style
        run: cargo fmt --all -- --check
      - name: Compile on-demand PowerShell RFC3161 signing bridge (no live TSA)
        run: cargo check --locked -p pdfcraft-sign --example rfc3161_external_pades_bt
      - name: One-shot LIVE Open TSA integration on public test PDF only
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[tsa-live]')
        shell: pwsh
        env:
          PDFCRAFT_TEST_PKCS12_PASSWORD: test
        run: |
          $ErrorActionPreference='Stop'
          $source = Join-Path $PWD 'crates/sign/tests/data/openssl-signed.pdf'
          $output = Join-Path $PWD 'target/rfc3161-open-tsa-NONQUALIFIED-TEST.pdf'
          $testKey = Join-Path $PWD 'crates/sign/tests/data/rsa-aes.p12'
          $adapter = Join-Path $PWD 'tools/rfc3161_provider_probe.ps1'
          $pwshExe = (Get-Process -Id $PID).Path
          $pdfDate = 'D:' + [DateTime]::UtcNow.ToString('yyyyMMddHHmmss') + 'Z'
          cargo run --locked -p pdfcraft-sign --example rfc3161_external_pades_bt -- $source $output $testKey $pwshExe $adapter open-tsa $pdfDate
          if ($LASTEXITCODE -ne 0) { throw 'Nonqualified Open TSA PAdES-B-T end-to-end test failed' }
          if (-not (Test-Path -LiteralPath $output)) { throw 'Signed PDF output missing' }
          Write-Host ('OPEN_TSA_PADES_B_T_NONQUALIFIED_E2E_PASS file_sha256=' + (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant())
          Write-Host 'BTRUST_QES=NOT_TESTED EU_DSS=NOT_TESTED QUALIFIED_TSA=NO'
