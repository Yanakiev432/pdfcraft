name: One-shot RustSec trust store lockfile refresh
on:
  push:
    branches:
      - security/fix-rustsec-2026-0382-0383-20261021
    paths:
      - '.github/workflows/rustsec-one-shot-lock-refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-only-approved-lockfile:
    if: github.repository == 'Yanakiev432/pdfcraft' && github.ref == 'refs/heads/security/fix-rustsec-2026-0382-0383-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - name: Pin only patched RustSec dependency versions
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rustls-webpki --precise 0.103.16
          cargo update -p webpki-root-certs --precise 1.0.10
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          lock=tomllib.loads(Path('Cargo.lock').read_text())
          packages={p['name']:p['version'] for p in lock['package']}
          assert packages['rustls-webpki']=='0.103.16', packages.get('rustls-webpki')
          assert packages['webpki-root-certs']=='1.0.10', packages.get('webpki-root-certs')
          print('RUSTSEC_0382_0383_FIXED_IN_LOCKFILE=PASS')
          PY
          changes=$(git diff --name-only)
          test "$changes" = 'Cargo.lock' || { printf '%s\n' "UNEXPECTED_SOURCE_CHANGES: $changes"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git commit -m 'fix(security): refresh certificate verifier and root bundle against RUSTSEC-2026-0382/0383'
          git push origin HEAD:security/fix-rustsec-2026-0382-0383-20261021
          echo 'SECURITY_LOCKFILE_PATCH_PUSHED=PASS'
